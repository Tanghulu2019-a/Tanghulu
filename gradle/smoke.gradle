// Optional development and packaged Fabric launch checks.
sourceSets {
    mikuConflict {
        java.srcDir 'compat/miku-conflict'
        resources.srcDir 'compat/miku-conflict-resources'
        compileClasspath += sourceSets.main.compileClasspath
    }
    compatSmoke {
        java.srcDir 'compat/smoke'
        resources.srcDir 'compat/smoke-resources'
        compileClasspath += sourceSets.main.output + sourceSets.main.compileClasspath
    }
}

tasks.named('processMikuConflictResources') {
    def priority = providers.gradleProperty('smokeMikuPriority').getOrElse('1000')
    inputs.property('priority', priority)
    filesMatching('miku-conflict.mixins.json') { expand priority: priority }
}
tasks.register('mikuConflictJar', Jar) {
    dependsOn 'mikuConflictClasses'
    from sourceSets.mikuConflict.output
    destinationDirectory = layout.buildDirectory.dir('miku-conflict/dev')
    archiveFileName = 'miku-redirect-conflict-test-only.jar'
}
def smokeJar = tasks.register('compatSmokeJar', Jar) {
    dependsOn 'compatSmokeClasses'
    from sourceSets.compatSmoke.output
    destinationDirectory = layout.buildDirectory.dir("compat-smoke/${mcVersion}/mods")
    archiveFileName = 'tanghulu-compat-smoke-test-only.jar'
}
loom {
    runs {
        compatSmoke {
            client()
            runDir "build/compat-smoke/${mcVersion}"
            vmArg '-Djava.awt.headless=true'
            vmArg "-Dtanghulu.smoke.minecraft=${mcVersion}"
            vmArg "-Dtanghulu.smoke.classes=${layout.buildDirectory.dir('classes/java/main').get().asFile.absolutePath}${File.pathSeparator}${project(':ancient').layout.buildDirectory.dir('classes/java/main').get().asFile.absolutePath}"
        }
    }
}
tasks.named('runCompatSmoke') { dependsOn smokeJar, 'classes', ':ancient:classes' }

def productionMappings = configurations.detachedConfiguration(dependencies.create("net.fabricmc:intermediary:${mcVersion}:v2"))
def packagedSmokeJar = tasks.named('remapCompatSmokeJar')

tasks.register('runPackagedSmoke', JavaExec) {
    dependsOn 'remapJar', packagedSmokeJar
    if (project.hasProperty('smokeMikuConflict')) dependsOn 'remapMikuConflictJar'
    def artifact = tasks.named('remapJar').flatMap { it.archiveFile }
    def vanilla = new File(gradle.gradleUserHomeDir, "caches/fabric-loom/${mcVersion}/minecraft-client.jar")
    classpath = configurations.runtimeClasspath.filter { f ->
        !f.name.contains('minecraft-') && !f.name.contains('meteor') && !f.name.startsWith('ancient-apple-hunter')
    } + productionMappings + files(vanilla)
    mainClass = 'net.fabricmc.loader.impl.launch.knot.KnotClient'
    workingDir = layout.buildDirectory.dir("packaged-smoke/${mcVersion}").get().asFile
    systemProperty 'fabric.development', 'false'
    systemProperty 'fabric.gameJarPath', vanilla.absolutePath
    systemProperty 'java.awt.headless', 'true'
    systemProperty 'tanghulu.smoke.minecraft', mcVersion
    systemProperty 'tanghulu.smoke.baritone', project.hasProperty('smokeBaritone')
    systemProperty 'tanghulu.smoke.mikuConflict', project.hasProperty('smokeMikuConflict')
    doFirst {
        workingDir.mkdirs()
        def addon = project.hasProperty('smokeAddonJar') ? file(project.property('smokeAddonJar')) : artifact.get().asFile
        def smokeMods = [addon, meteorJar, packagedSmokeJar.get().archiveFile.get().asFile]
        if (project.hasProperty('smokeMikuConflict')) {
            if (!project.hasProperty('smokeBaritone')) throw new GradleException('smokeMikuConflict requires smokeBaritone')
            smokeMods.add(tasks.named('remapMikuConflictJar').get().archiveFile.get().asFile)
        }
        if (project.hasProperty('smokeBaritone')) {
            smokeMods.addAll(configurations.detachedConfiguration(
                dependencies.create("meteordevelopment:baritone:${mcVersion}-SNAPSHOT")
            ).files)
        }
        systemProperty 'fabric.addMods', smokeMods.collect { it.absolutePath }.join(File.pathSeparator)
        systemProperty 'tanghulu.smoke.classes', addon.absolutePath
    }
}
