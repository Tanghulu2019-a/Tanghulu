plugins {
    id 'fabric-loom' version '1.15.5'
    id 'com.gradleup.shadow' version '9.2.2' apply false
}

group = 'dev.tanghulu'
version = '1.0.5'
apply from: 'compatibility.gradle'
base { archivesName = "Tanghulu-mc${mcVersion}" }

repositories {
    mavenCentral()
    maven { url = 'https://maven.meteordev.org/releases' }
    maven { url = 'https://maven.meteordev.org/snapshots' }
    maven { url = 'https://api.modrinth.com/maven' }
    maven { url = 'https://maven.seedfinding.com' }
}

configurations { extraLibs }
configurations.implementation.extendsFrom(configurations.extraLibs)

// Map the optional XaeroPlus API for compilation without changing its runtime JAR
// or upgrading Tanghulu's existing Loom/Gradle toolchain.
def xaeroPlusCompileJar = tasks.register('prepareXaeroPlusCompileJar', net.fabricmc.loom.task.RemapJarTask) {
    inputFile = compatDeps != null ? mapJar('xaeroplus') : file('libs/XaeroPlus-2.35.1-fabric-1.21.11.jar')
    destinationDirectory = layout.buildDirectory.dir('compile-dependencies')
    archiveFileName = 'XaeroPlus-2.35.1-named.jar'
    sourceNamespace = 'intermediary'
    targetNamespace = 'named'
    addNestedDependencies = false
    useMixinAP = false
    classpath.setFrom(files())
}

dependencies {
    minecraft "com.mojang:minecraft:${mcVersion}"
    mappings "net.fabricmc:yarn:${yarnVersion}:v2"
    modImplementation 'net.fabricmc:fabric-loader:0.18.2'
    modImplementation files(meteorJar)
    implementation project(path: ':ancient', configuration: 'compatLibrary')
    implementation 'meteordevelopment:orbit:0.2.4'
    compileOnly 'org.projectlombok:lombok:1.18.42'
    annotationProcessor 'org.projectlombok:lombok:1.18.42'
    modCompileOnly "meteordevelopment:baritone:${mcVersion}-SNAPSHOT"
    if (compatDeps != null) {
        modCompileOnly files(mapJar('xaeros-minimap'), mapJar('xaeros-world-map'))
    } else {
        modCompileOnly 'maven.modrinth:xaeros-minimap:fabric-1.21.11-26.4.2'
        modCompileOnly 'maven.modrinth:xaeros-world-map:fabric-1.21.11-1.44.2'
    }
    compileOnly files(xaeroPlusCompileJar.flatMap { it.archiveFile }).builtBy(xaeroPlusCompileJar)
    ['mc_biome:1.171.1', 'mc_core:1.210.0', 'mc_feature:1.171.10',
     'mc_math:1.171.0', 'mc_noise:1.171.1', 'mc_seed:1.171.2',
     'mc_terrain:1.171.1'].each {
        extraLibs("com.seedfinding:${it}") { transitive = false }
    }
}

java { sourceCompatibility = JavaVersion.VERSION_21; targetCompatibility = JavaVersion.VERSION_21 }
tasks.withType(JavaCompile).configureEach { options.release = 21; options.encoding = 'UTF-8' }
processResources {
    inputs.properties compatProperties
    filesMatching('fabric.mod.json') { expand compatProperties }
    from('LICENSE') { into 'META-INF/licenses/tanghulu' }
    from('NOTICE.md') { into 'META-INF/licenses/tanghulu' }
    from('licenses') { into 'META-INF/licenses/tanghulu' }
}

def prediction26 = tasks.register('compilePrediction26', Exec) {
    inputs.dir('prediction26/src')
    inputs.file('prediction26/build-helper.py')
    outputs.file(layout.buildDirectory.file('prediction26/prediction26.jar'))
    commandLine 'python', 'prediction26/build-helper.py'
}
tasks.named('processResources') {
    dependsOn prediction26
    from(layout.buildDirectory.file('prediction26/prediction26.jar')) { into 'tanghulu/prediction' }
}

def mushroomWorker = tasks.register('compileMushroomWorker', JavaCompile) {
    source = fileTree('mushroom/src') { include '**/*.java' }
    classpath = files()
    destinationDirectory = layout.buildDirectory.dir('mushroom/classes')
    options.release = 21
}
def mushroomJar = tasks.register('mushroomWorkerJar', Jar) {
    dependsOn mushroomWorker
    from mushroomWorker.flatMap { it.destinationDirectory }
    destinationDirectory = layout.buildDirectory.dir('mushroom')
    archiveFileName = 'worker.jar'
}
tasks.named('processResources') {
    dependsOn mushroomJar
    from(mushroomJar.flatMap { it.archiveFile }) { into 'tanghulu/mushroom' }
}

evaluationDependsOn(':ancient')
def ancientShadow = project(':ancient').tasks.named('shadowJar')
jar {
    dependsOn ancientShadow
    duplicatesStrategy = DuplicatesStrategy.EXCLUDE
    from({ zipTree(ancientShadow.get().archiveFile.get().asFile) }) {
        exclude 'fabric.mod.json', 'META-INF/MANIFEST.MF'
    }
    from({ configurations.extraLibs.collect { it.isDirectory() ? it : zipTree(it) } }) {
        exclude 'META-INF/MANIFEST.MF', 'META-INF/*.SF', 'META-INF/*.RSA', 'META-INF/*.DSA'
    }
}

tasks.named('remapJar') {
    inputs.file('build-support/compress-jar.py')
    doLast {
        def compression = providers.exec {
            commandLine 'python', 'build-support/compress-jar.py', archiveFile.get().asFile.absolutePath
        }
        logger.lifecycle(compression.standardOutput.asText.get().trim())
    }
}

tasks.named('check') { dependsOn ':ancient:unitChecks' }

sourceSets {
    seedQa {
        java.srcDir 'prediction26/client-qa'
        java.srcDir 'mushroom/client-qa'
        compileClasspath += sourceSets.main.output + sourceSets.main.compileClasspath
        runtimeClasspath += sourceSets.main.output + sourceSets.main.compileClasspath
    }
}
tasks.register('seedCompatibilityChecks', JavaExec) {
    dependsOn tasks.named('seedQaClasses')
    classpath = sourceSets.seedQa.runtimeClasspath
    mainClass = 'dev.tanghulu.prediction26.ClientAudit'
    systemProperty 'prediction26.testCache', layout.buildDirectory.dir('prediction26/client-test').get().asFile.absolutePath
    doFirst {
        copy {
            from layout.buildDirectory.file('prediction26/server.jar')
            into layout.buildDirectory.dir('prediction26/client-test/tanghulu-prediction/26.3')
        }
    }
}
tasks.named('check') { dependsOn 'seedCompatibilityChecks' }

tasks.register('mushroomClientChecks', JavaExec) {
    dependsOn tasks.named('seedQaClasses')
    classpath = sourceSets.seedQa.runtimeClasspath
    mainClass = 'dev.tanghulu.mushroom.ClientMushroomAudit'
    systemProperty 'prediction26.testCache', layout.buildDirectory.dir('mushroom/client-test').get().asFile.absolutePath
    args projectDir.absolutePath
    if(project.hasProperty("qaCache")) args project.property("qaCache")
}

// Keep the standalone scanner regression checks in the normal build.
tasks.register("mushroomScannerChecks", JavaExec) {
    dependsOn "compileMushroomAudit"
    classpath = files(layout.buildDirectory.dir("mushroom/audit"), mushroomWorker.flatMap { it.destinationDirectory })
    mainClass = "dev.tanghulu.mushroom.IslandScannerAudit"
}
tasks.register("compileMushroomAudit", JavaCompile) {
    dependsOn mushroomWorker
    source = files("mushroom/qa/IslandScannerAudit.java")
    classpath = files(mushroomWorker.flatMap { it.destinationDirectory })
    destinationDirectory = layout.buildDirectory.dir("mushroom/audit")
    options.release = 21
}
tasks.named("check") { dependsOn "mushroomScannerChecks" }

tasks.register('waypointCleanerChecks', Exec) {
    commandLine 'python', 'build-support/verify-waypoint-cleaner.py'
}
tasks.named('check') { dependsOn 'waypointCleanerChecks' }

tasks.register('systemChatChecks', JavaExec) {
    dependsOn tasks.named('seedQaClasses')
    classpath = sourceSets.seedQa.runtimeClasspath
    mainClass = 'dev.tanghulu.network.SystemChatAuditLauncher'
    args projectDir.absolutePath
}
tasks.named('check') { dependsOn 'systemChatChecks' }

sourceSets {
    threeCQa {
        java.srcDir 'threec/qa'
        compileClasspath += sourceSets.main.output + sourceSets.main.compileClasspath
        runtimeClasspath += sourceSets.main.output + sourceSets.main.runtimeClasspath
    }
}
tasks.register('threeCChecks', JavaExec) {
    dependsOn tasks.named('threeCQaClasses')
    classpath = sourceSets.threeCQa.runtimeClasspath
    mainClass = 'dev.tanghulu.threec.ThreeCChecks'
    args projectDir.absolutePath
}
tasks.named('check') { dependsOn 'threeCChecks' }
// Opt-in network smoke test; normal builds stay offline and deterministic.
tasks.register('threeCLiveCheck', JavaExec) {
    dependsOn tasks.named('threeCQaClasses')
    classpath = sourceSets.threeCQa.runtimeClasspath
    mainClass = 'dev.tanghulu.threec.ThreeCLiveCheck'
    doFirst {
        if (!project.hasProperty('playerName')) throw new GradleException('Use -PplayerName=<name>')
        args project.property('playerName')
    }
}

sourceSets {
    skeletonQa {
        java.srcDir 'skeleton/qa'
        compileClasspath += sourceSets.main.output + sourceSets.main.compileClasspath
        runtimeClasspath += sourceSets.main.output + sourceSets.main.runtimeClasspath
    }
}

tasks.register('playerSkeletonChecks', JavaExec) {
    dependsOn tasks.named('skeletonQaClasses')
    classpath = sourceSets.skeletonQa.runtimeClasspath
    mainClass = 'dev.tanghulu.skeleton.PlayerSkeletonCheckLauncher'
}

tasks.named('check') { dependsOn 'playerSkeletonChecks' }

tasks.register('release101Checks', Exec) {
    commandLine 'python', 'build-support/verify-101.py'
}
tasks.named('check') { dependsOn 'release101Checks' }

tasks.register('compileBaritoneAssistantAudit', JavaCompile) {
    source = files('src/main/java/dev/tanghulu/stash/navigation/OneClickTravel.java',
                   'navigation/qa/OneClickTravelChecks.java')
    classpath = files()
    destinationDirectory = layout.buildDirectory.dir('navigation/audit')
    options.release = 21
}

tasks.register('baritoneAssistantChecks', JavaExec) {
    dependsOn 'compileBaritoneAssistantAudit'
    classpath = files(layout.buildDirectory.dir('navigation/audit'))
    mainClass = 'dev.tanghulu.stash.navigation.OneClickTravelChecks'
}

tasks.named('check') { dependsOn 'baritoneAssistantChecks' }

sourceSets {
    stashQa {
        java.srcDir 'navigation/qa'
        compileClasspath += sourceSets.main.output + sourceSets.main.compileClasspath
        runtimeClasspath += sourceSets.main.output + sourceSets.main.runtimeClasspath + sourceSets.skeletonQa.output
    }
}
tasks.register('stashRecordsChecks', JavaExec) {
    dependsOn 'stashQaClasses', 'skeletonQaClasses'
    classpath = sourceSets.stashQa.runtimeClasspath
    mainClass = 'dev.tanghulu.skeleton.PlayerSkeletonCheckLauncher'
    systemProperty 'tanghulu.qa.main', 'dev.tanghulu.stash.StashRecordsChecks'
}
tasks.named('check') { dependsOn 'stashRecordsChecks' }

tasks.register('ancientLootChecks', JavaExec) {
    dependsOn 'stashQaClasses', 'skeletonQaClasses'
    classpath = sourceSets.stashQa.runtimeClasspath + project(':ancient').sourceSets.main.output
    mainClass = 'dev.tanghulu.skeleton.PlayerSkeletonCheckLauncher'
    systemProperty 'tanghulu.qa.main', 'dev.tanghulu.stash.AncientLootChecks'
}
tasks.named('check') { dependsOn 'ancientLootChecks' }

tasks.register('compileNotebotAudit', JavaCompile) {
    source = files('src/main/java/dev/tanghulu/addon/util/notebot/TuneConfirmation.java',
                   'src/main/java/dev/tanghulu/addon/util/notebot/PlaybackCursor.java',
                   'src/main/java/dev/tanghulu/addon/util/notebot/TuneRetryPolicy.java',
                   'notebot/qa/TuneConfirmationChecks.java', 'notebot/qa/PlaybackCursorChecks.java',
                   'notebot/qa/TuneRetryChecks.java')
    classpath = files()
    destinationDirectory = layout.buildDirectory.dir('notebot/audit')
    options.release = 21
}

tasks.register('notebotChecks', JavaExec) {
    dependsOn 'compileNotebotAudit'
    classpath = files(layout.buildDirectory.dir('notebot/audit'))
    mainClass = 'dev.tanghulu.notebot.TuneConfirmationChecks'
}

tasks.named('check') { dependsOn 'notebotChecks' }

sourceSets.skeletonQa.java.srcDir 'notebot/client-qa'
tasks.register('notebotInteractionChecks', JavaExec) {
    dependsOn 'skeletonQaClasses'
    classpath = sourceSets.skeletonQa.runtimeClasspath
    mainClass = 'dev.tanghulu.skeleton.PlayerSkeletonCheckLauncher'
    systemProperty 'tanghulu.qa.main', 'dev.tanghulu.notebot.NotebotInteractionChecks'
}
tasks.named('check') { dependsOn 'notebotInteractionChecks' }

tasks.register('notebotPlaybackChecks', JavaExec) {
    dependsOn 'compileNotebotAudit'
    classpath = files(layout.buildDirectory.dir('notebot/audit'))
    mainClass = 'dev.tanghulu.notebot.PlaybackCursorChecks'
}
tasks.named('check') { dependsOn 'notebotPlaybackChecks' }

tasks.register('notebotRetryChecks', JavaExec) {
    dependsOn 'compileNotebotAudit'
    classpath = files(layout.buildDirectory.dir('notebot/audit'))
    mainClass = 'dev.tanghulu.notebot.TuneRetryChecks'
}
tasks.named('check') { dependsOn 'notebotRetryChecks' }

tasks.register('notebotFeatureChecks', JavaExec) {
    dependsOn 'skeletonQaClasses'
    classpath = sourceSets.skeletonQa.runtimeClasspath
    mainClass = 'dev.tanghulu.skeleton.PlayerSkeletonCheckLauncher'
    systemProperty 'tanghulu.qa.main', 'dev.tanghulu.notebot.NotebotFeatureChecks'
}
tasks.named('check') { dependsOn 'notebotFeatureChecks' }

sourceSets {
    compatQa {
        java.srcDir 'compat/qa'
        compileClasspath += sourceSets.main.output + sourceSets.main.compileClasspath
        runtimeClasspath += sourceSets.main.output + sourceSets.main.runtimeClasspath + project(':ancient').sourceSets.main.output
    }
}
tasks.register('mixinApiChecks', JavaExec) {
    dependsOn 'compatQaClasses', ':ancient:classes'
    classpath = sourceSets.compatQa.runtimeClasspath
    mainClass = 'dev.tanghulu.compat.MixinApiChecks'
    args layout.buildDirectory.dir('classes/java/main').get().asFile.absolutePath,
        project(':ancient').layout.buildDirectory.dir('classes/java/main').get().asFile.absolutePath
}
tasks.named('check') { dependsOn 'mixinApiChecks' }
tasks.withType(JavaExec).configureEach { systemProperty 'tanghulu.qa.minecraft', mcVersion }
tasks.register('terrainCompatibilityChecks', JavaExec) {
    dependsOn 'compatQaClasses', 'skeletonQaClasses'
    classpath = sourceSets.compatQa.runtimeClasspath + sourceSets.skeletonQa.output
    mainClass = 'dev.tanghulu.skeleton.PlayerSkeletonCheckLauncher'
    systemProperty 'tanghulu.qa.main', 'dev.tanghulu.compat.TerrainCompatibilityChecks'
    args layout.buildDirectory.dir("terrain-compat/${mcVersion}").get().asFile.absolutePath
    maxHeapSize = '3G'
}

sourceSets {
    compatSmoke {
        java.srcDir 'compat/smoke'
        resources.srcDir 'compat/smoke-resources'
        compileClasspath += sourceSets.main.compileClasspath
    }
}
def smokeJar = tasks.register('compatSmokeJar', Jar) {
    dependsOn 'compatSmokeClasses'
    from sourceSets.compatSmoke.output
    destinationDirectory = layout.buildDirectory.dir("compat-smoke/${mcVersion}/mods")
    archiveFileName = 'tanghulu-compat-smoke-test-only.jar'
}
loom {
    runs {
        compatSmoke {
            client()
            runDir "build/compat-smoke/${mcVersion}"
            vmArg '-Djava.awt.headless=true'
            vmArg "-Dtanghulu.smoke.minecraft=${mcVersion}"
            vmArg "-Dtanghulu.smoke.classes=${layout.buildDirectory.dir('classes/java/main').get().asFile.absolutePath}${File.pathSeparator}${project(':ancient').layout.buildDirectory.dir('classes/java/main').get().asFile.absolutePath}"
        }
    }
}
tasks.named('runCompatSmoke') { dependsOn smokeJar, 'classes', ':ancient:classes' }

def productionMappings = configurations.detachedConfiguration(dependencies.create("net.fabricmc:intermediary:${mcVersion}:v2"))
tasks.register('runPackagedSmoke', JavaExec) {
    dependsOn 'remapJar', smokeJar
    def artifact = tasks.named('remapJar', net.fabricmc.loom.task.RemapJarTask).flatMap { it.archiveFile }
    def vanilla = new File(gradle.gradleUserHomeDir, "caches/fabric-loom/${mcVersion}/minecraft-client.jar")
    classpath = configurations.runtimeClasspath.filter { f ->
        !f.name.contains('minecraft-') && !f.name.contains('meteor') && !f.name.startsWith('ancient-apple-hunter')
    } + productionMappings + files(vanilla)
    mainClass = 'net.fabricmc.loader.impl.launch.knot.KnotClient'
    workingDir = layout.buildDirectory.dir("packaged-smoke/${mcVersion}").get().asFile
    systemProperty 'fabric.development', 'false'
    systemProperty 'fabric.gameJarPath', vanilla.absolutePath
    systemProperty 'java.awt.headless', 'true'
    systemProperty 'tanghulu.smoke.minecraft', mcVersion
    doFirst {
        workingDir.mkdirs()
        systemProperty 'fabric.addMods', [artifact.get().asFile, meteorJar, smokeJar.get().archiveFile.get().asFile].collect { it.absolutePath }.join(File.pathSeparator)
        systemProperty 'tanghulu.smoke.classes', artifact.get().asFile.absolutePath
    }
}


