// This source tree targets Minecraft 1.21.11 only.
ext.mcVersion = providers.gradleProperty('mcVersion').getOrElse('1.21.11')
if (mcVersion != '1.21.11') throw new GradleException("Only Minecraft 1.21.11 is supported: ${mcVersion}")
def lockFile = file("libs/${mcVersion}/dependencies.json")
ext.compatDeps = lockFile.exists() ? new groovy.json.JsonSlurper().parse(lockFile) : null
ext.yarnVersion = compatDeps != null ? compatDeps.yarn : '1.21.11+build.3'
ext.meteorJar = compatDeps != null ? file("libs/${mcVersion}/meteor.jar") : file('libs/meteor-client-1.21.11-86.jar')
ext.mapJar = { String projectName -> file("libs/${mcVersion}/${projectName}.jar") }
ext.compatProperties = [version: project.version, minecraft_version: mcVersion]

allprojects { p ->
    def prepare = p.tasks.register('prepareCompatibilitySources', Exec) {
        inputs.dir(p.file('src/main/java'))
        inputs.file(rootProject.file('build-support/compat-sources.py'))
        inputs.property('minecraft', rootProject.mcVersion)
        outputs.dir(p.layout.buildDirectory.dir('generated/compat/java'))
        commandLine 'python', rootProject.file('build-support/compat-sources.py'), rootProject.mcVersion,
            p.projectDir, p.layout.buildDirectory.dir('generated/compat/java').get().asFile
    }
    p.plugins.withId('java') {
        p.sourceSets.main.java.setSrcDirs([prepare.map { p.layout.buildDirectory.dir('generated/compat/java').get().asFile }])
        p.tasks.named('compileJava') { dependsOn prepare }
    }
}
